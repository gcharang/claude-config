name: Skills Tests

on:
  push:
    paths:
      # skills/scripts/** (the Python package) plus every tree the
      # reference-resolution guard scans: skill/agent markdown and the
      # conventions/output-styles files their <file uri> targets point at.
      - 'skills/**'
      - 'agents/**'
      - 'conventions/**'
      - 'output-styles/**'
      - '.github/workflows/skills-test.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'agents/**'
      - 'conventions/**'
      - 'output-styles/**'
      - '.github/workflows/skills-test.yml'
  workflow_dispatch:

jobs:
  test-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        working-directory: skills/scripts
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: skills/scripts
        run: pytest tests/ -v
        env:
          PYTHONPATH: .
